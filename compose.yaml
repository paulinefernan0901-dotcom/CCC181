services:
  db:
    image: postgres:17
    container_name: cashierq-db
    environment:
      POSTGRES_USER: cashierq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cashierq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashierq -d cashierq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: